name: Verify macOS Apple Silicon

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun run dependencies:install
      - run: bun run browsers:install:all
      - run: bun run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-verification
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
